<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krushidhan ERP — Starting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #064e3b 0%, #0f766e 100%);
      color: #f8fafc;
      user-select: none;
    }
    .splash-card {
      width: 390px;
      padding: 28px 26px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .brand {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 18px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 14px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #6ee7b7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .status {
      font-size: 12.5px;
      color: #a7f3d0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-card" role="status" aria-live="polite">
    <div class="brand">KRUSHIDHAN AGRI-INPUT SHOP ERP</div>
    <div class="sub">Local Offline Desktop Workspace</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="status">Starting local SQLite engine and security service...</div>
  </div>
</body>
</html>
