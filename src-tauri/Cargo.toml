[package]
name = "krushidhan-erp"
version = "1.0.0"
description = "Krushidhan Agri-Input Shop ERP Desktop Shell"
authors = ["Krushidhan ERP"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "krushidhan_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "krushidhan-erp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
